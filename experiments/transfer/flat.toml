# The flat arm of the transfer family.
#
# Three configurations — flat, rough, fractal — identical in every section but
# [environment], plus mating.toml for controlled hybrids. That is what makes a
# population portable between them: `--founders` refuses an import unless the
# body limits and controller layout match, and holding everything else fixed is
# what makes a fitness difference attributable to the ground and nothing else.
#
# These are the Terrain A/B arms from docs/RESULTS.md, renamed. Seed 20260906 gives
# every arm the same hundred founders, and every organism in an arm meets the
# same three trials. Do not change a value here without changing it in all four
# files.
#
#   evo run experiments/transfer/flat.toml
#   evo evaluate experiments/transfer/fractal.toml --founders runs/transfer-flat-<ts>
#
# See docs/TUTORIALS.md for the experiments these support.

[experiment]
name = "transfer-flat"
seed = 20260906
output_dir = "runs"

[evolution]
population_size = 100
generations = 100
elite_count = 2
tournament_size = 4
crossover_rate = 0.7
immigrant_rate = 0.02

[mutation]
sensor_rate = 0.03
sensor_dir_sigma = 0.15
weight_rate = 0.08
weight_sigma = 0.25
weight_reset_rate = 0.05
size_rate = 0.05
size_sigma = 0.03
attach_rate = 0.05
attach_sigma = 0.15
joint_limit_rate = 0.05
joint_limit_sigma = 0.2
joint_kind_rate = 0.02
joint_axis_rate = 0.03
motor_rate = 0.05
motor_sigma = 0.15
caution_rate = 0.08
caution_sigma = 0.12
pair_rate = 0.05
repeat_rate = 0.04
shape_rate = 0.04
add_part_rate = 0.06
remove_part_rate = 0.05

[body]
sensor_probability = 0.0
min_parts = 2
max_parts = 8
min_half_extent = 0.05
max_half_extent = 0.2
density = 1000.0
min_joint_limit = 0.3
max_joint_limit = 1.4
max_motor_speed = 6.0
max_motor_torque = 200.0
hinge_probability = 0.85
shapes = ["box", "taper", "sphere", "capsule", "cylinder"]
taper_top_scale = 0.45
# Non-zero, so the corpse gate can switch motors off and measure free distance.
joint_endurance = 150.0
min_drive = 0.2
muscle_stress = 12000.0
tendon_frequency = 6.0
tendon_damping = 0.5
pair_probability = 0.45
max_repeat = 3

[brain]
hidden = 12
init_sigma = 0.8
weight_limit = 8.0

[simulation]
# Timestep defaults to 1/120 s. Do not write a rounded decimal here: that is
# not exactly 1/120 and would change the step count.
duration = 8.0
control_hz = 20.0
solver_iterations = 12
settle_time = 0.5
baumgarte = 0.2
slop = 0.002
max_correction_speed = 2.0
max_linear_speed = 60.0
max_angular_speed = 40.0
trials = 3
start_jitter = 0.5
aggregate = "mean"
steer = true
steer_spread = 0.9

[environment]
terrain = "flat"
self_collision = true
terrain_amplitude = 0.05
terrain_wavelength = 1.6
# Pinned in every arm so that `--seed` replicates move the founders and the
# trials but never the ground. This is the value seed 20260906 derives, which
# keeps the fractal arm byte-identical to the runs behind docs/RESULTS.md.
terrain_seed = 183821489130240734
terrain_octaves = 4
terrain_lacunarity = 2.0
terrain_gain = 0.5
terrain_warp = 0.3
terrain_detail_amplitude = 0.0
terrain_detail_wavelength = 3.0
terrain_detail_octaves = 4
terrain_modulation = 0.0
terrain_modulation_wavelength = 35.0
terrain_step = 0.0
terrain_riser = 0.12
terrain_terrace_mask = false
terrain_per_trial = true
gravity = 9.81
friction = 0.9
restitution = 0.0
linear_damping = 0.02
angular_damping = 0.05

[fitness]
objective = "heading"
energy_penalty = 0.0
upright_bonus = 0.2
air_bonus = 0.0
height_bonus = 0.0
climb_bonus = 0.0
descent_penalty = 0.0
cumulative_climb_bonus = 0.0
cumulative_descent_penalty = 0.0
climb_deadband = 0.05
fall_penalty = 0.0

[sensor]
range = 4.0
rays = 3
spread = 0.35

[recording]
top_n = 4
random_samples = 3
record_hz = 30.0
every_generations = 10
store_genomes = true

[checkpoint]
every_generations = 25
on_finish = true
