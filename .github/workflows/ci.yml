name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The determinism contract is a cross-platform claim: `math`'s hand-rolled
  # transcendentals exist precisely so that results do not depend on the platform
  # libm. Testing on one OS and one architecture cannot show that. The golden
  # values in tests/golden.rs are what make this matrix meaningful — they compare
  # against committed constants rather than against another run on the same
  # machine.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets

  # `evo verify` is the determinism check as a command rather than a test, run
  # against a real experiment config. Cheap, and it exercises the CLI path.
  verify:
    name: verify determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --bin evo -- verify experiments/first-walkers.toml --generations 3

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The viewer mirrors the simulator's height field in JavaScript rather than
  # being shipped a sampled patch, and pays for that by being checkable: the
  # terrain check compares its heights against ones the Rust side emitted. The
  # other two checks are pure logic (which organism a guided sequence shows, and
  # what serve.py answers) that would otherwise only fail in a browser. None of
  # this needs a browser, so it runs here.
  viewer:
    name: viewer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Terrain mirror
        run: |
          cargo run --release --example terrain_samples > "$RUNNER_TEMP/samples.json"
          node viewer/terrain_check.mjs "$RUNNER_TEMP/samples.json"
      - name: Library sequences
        run: node viewer/library_check.mjs
      - name: Server
        run: python viewer/serve_check.py
